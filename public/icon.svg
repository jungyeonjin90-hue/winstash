<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Badge -->
  <rect width="100" height="100" rx="24" fill="url(#grad)" />
  
  <!-- 3-Tier Isometric Vault Line Art -->
  <g transform="translate(18, 18) scale(2.66)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Isometric Diamond Tier -->
    <polygon points="12 2 21 7 12 12 3 7" stroke="#ffffff" />
    <!-- Tier 2: Middle Layer -->
    <path d="M3 12l9 5 9-5" stroke="#ffffff" />
    <!-- Tier 3: Bottom Layer -->
    <path d="M3 17l9 5 9-5" stroke="#ffffff" />
    <!-- Center Axis -->
    <line x1="12" y1="12" x2="12" y2="22" stroke="#ffffff" />
  </g>
</svg>
